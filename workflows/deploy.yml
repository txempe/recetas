name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: |
        npm install -g pagefind
        sudo apt-get update
        sudo apt-get install -y poppler-utils

    - name: Create searchable pdf pages
      run: |

        mkdir -p pdf-index

        find platos -iname "*.pdf" | while read pdf
        do

          name=$(basename "$pdf" .pdf)

          pdftotext "$pdf" -

          pdftotext "$pdf" "pdf-index/${name}.txt"

          cat > "pdf-index/${name}.html" << EOF
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>${name}</title>
</head>
<body>

<h1>${name}</h1>

<p>
../${pdf}Abrir PDF</a>
</p>

<pre>
$(cat "pdf-index/${name}.txt")
</pre>

</body>
</html>
EOF

        done

    - name: Generate Search Index
      run: pagefind --site .

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: .

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
