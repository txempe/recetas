<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Buscador de recetas</title>

    <script src="/recetas/pagefind/pagefind-ui.js"></script>
    <link href="/recetas/pagefind/pagefind-ui.css" rel="stylesheet" />

</head>

<body>

<h1>Buscador de recetas PDF</h1>

<div id="search"></div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    new PagefindUI({
        element: "#search",
        showSubResults: true
    });
});
</script>

</body>
</html>
