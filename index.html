<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mi Recetario</title>

<style>

:root{

    --bg:#0f172a;
    --bg-gradient:#111827;

    --card:#1e293b;
    --card-hover:#29384d;

    --text:#f8fafc;
    --muted:#94a3b8;

    --border:#334155;

    --primary:#3b82f6;
    --primary-soft:rgba(59,130,246,.15);

    --shadow:0 15px 35px rgba(0,0,0,.3);
}

body.light{

    --bg:#f3f6fb;
    --bg-gradient:#ffffff;

    --card:#ffffff;
    --card-hover:#f8fafc;

    --text:#1f2937;
    --muted:#64748b;

    --border:#e2e8f0;

    --primary:#2563eb;
    --primary-soft:rgba(37,99,235,.08);

    --shadow:0 10px 30px rgba(0,0,0,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, Arial, sans-serif;

    background:
    radial-gradient(circle at top left,var(--bg-gradient),var(--bg));

    color:var(--text);

    min-height:100vh;

    padding:22px 20px;

    transition:.3s;
}

.container{
    max-width:1300px;
    margin:auto;
}

.topbar{

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
}

.theme-btn{

    border:none;

    background:var(--card);

    color:var(--text);

    border:1px solid var(--border);

    border-radius:999px;

    padding:7px 16px;

    cursor:pointer;

    box-shadow:var(--shadow);

    transition:.2s;
}

.theme-btn:hover{
    transform:translateY(-2px);
}

header{
    text-align:center;
    margin-bottom:20px;
}

header h1{

    font-size:3.2rem;
    font-weight:700;

    letter-spacing:-1px;

    margin-bottom:0;
}

header p{

    color:var(--muted);

    font-size:1.05rem;
}

.search-container{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:24px;

    padding:16px 25px;

    margin-bottom:16px;

    box-shadow:var(--shadow);
}

.search-wrapper{
    position:relative;
}

.search-wrapper::before{

    content:"🔎";

    position:absolute;

    left:18px;
    top:50%;
    transform:translateY(-50%);
    pointer-events:none;

    font-size:22px;
}

.search-wrapper input{

    width:100%;

    padding:11px 20px 11px 55px;

    border-radius:16px;

    border:1px solid var(--border);

    background:var(--bg);

    color:var(--text);

    font-size:18px;

    transition:.2s;
}

.search-wrapper input:focus{

    outline:none;

    border-color:var(--primary);

    box-shadow:0 0 0 4px rgba(59,130,246,.15);
}

.stats{

    margin-top:10px;

    display:flex;

    gap:12px;

    flex-wrap:wrap;
}

.badge{

    padding:5px 14px;

    border-radius:999px;

    background:var(--primary-soft);

    color:var(--primary);

    font-weight:600;
}

.section{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:24px;

    padding:16px 25px;

    margin-bottom:16px;

    box-shadow:var(--shadow);
}

.section-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    flex-wrap:wrap;

    gap:10px;

    margin-bottom:10px;
}

.section-header h2{
    font-size:1.6rem;
}

.counter{

    background:var(--primary-soft);

    color:var(--primary);

    border-radius:999px;

    padding:5px 14px;

    font-weight:600;
}

.lista{

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));

    gap:8px;
}

.resultado a{

    display:flex;

    align-items:center;

    gap:12px;

    text-decoration:none;

    color:var(--text);

    background:var(--bg);

    border:1px solid var(--border);

    border-radius:14px;

    padding:9px 16px;

    transition:.2s;
}

.resultado a:hover{

    transform:translateY(-3px);

    border-color:var(--primary);

    background:var(--card-hover);
}

.pdf{
    font-size:22px;
}

.sin-resultados{

    padding:12px;

    color:var(--muted);
}

@media(max-width:768px){

    body{
        padding:12px 10px;
    }

    header h1{
        font-size:2.2rem;
    }

    .lista{
        grid-template-columns:1fr;
    }

}

[hidden]{
    display:none !important;
}

.section-header{
    justify-content:center;
    align-items:center;
    flex-wrap:nowrap;
    gap:10px;
    text-align:center;
}

.section-header h2{
    flex-basis:auto;
}

</style>
</head>

<body>

<div class="container">

    <div class="topbar">
        <button id="favoritasToggle" class="theme-btn" type="button"
                aria-controls="favoritasSection" aria-expanded="false">
            ⭐ Mostrar favoritas
        </button>
        <button id="themeToggle" class="theme-btn">
            ☀️ / 🌙
        </button>
    </div>

    <header>
        <h1>📖 Recetario</h1>
    </header>

    <div class="search-container">

        <div class="search-wrapper">
            <input
                type="text"
                id="buscar"
                placeholder="Buscar receta..."
                autofocus>
        </div>

        <div class="stats">

            <div class="badge">
                ⭐ Favoritas:
                <span id="countFavoritas">0</span>
            </div>

            <div class="badge">
                📚 Total:
                <span id="countTotal">0</span>
            </div>

        </div>

    </div>

    <div class="section" id="favoritasSection" hidden>

        <div class="section-header">

            <h2>⭐ Favoritas</h2>

            <div
                class="counter"
                id="favoritasCounter">
                0 recetas
            </div>

        </div>

        <div id="favoritas" class="lista"></div>

    </div>

    <div class="section">

        <div class="section-header">

            <h2>📚 Resto de recetas</h2>

            <div
                class="counter"
                id="restoCounter">
                0 recetas
            </div>

        </div>

        <div id="resto" class="lista"></div>

    </div>

</div>

<script>

function coincideBusqueda(nombre, filtro){
    const texto = nombre.toLowerCase();
    const palabras = filtro.toLowerCase().trim().split(/\s+/).filter(Boolean);
    return palabras.every(palabra => texto.includes(palabra));
}

const favoritasToggle = document.getElementById('favoritasToggle');
const favoritasSection = document.getElementById('favoritasSection');

favoritasToggle.addEventListener('click', () => {
    const mostrar = favoritasSection.hidden;
    favoritasSection.hidden = !mostrar;
    favoritasToggle.setAttribute('aria-expanded', String(mostrar));
    favoritasToggle.textContent = mostrar
        ? '⭐ Ocultar favoritas'
        : '⭐ Mostrar favoritas';
});

const temaGuardado = localStorage.getItem('tema');

if(temaGuardado === 'light'){
    document.body.classList.add('light');
}

document
.getElementById('themeToggle')
.addEventListener('click', () => {

    document.body.classList.toggle('light');

    localStorage.setItem(
        'tema',
        document.body.classList.contains('light')
            ? 'light'
            : 'dark'
    );

});

fetch('pdfs.json')
.then(r => r.json())
.then(pdfs => {

    const favoritas = pdfs.filter(pdf =>
        pdf.ruta.toLowerCase().startsWith('favoritas/')
    );

    const resto = pdfs.filter(pdf =>
        !pdf.ruta.toLowerCase().startsWith('favoritas/')
    );

    document.getElementById('countTotal').textContent =
        pdfs.length;

    function pintar(
        lista,
        contenedor,
        contador,
        filtro
    ){

        filtro = filtro.toLowerCase().trim();

        const encontrados = lista.filter(pdf =>
            coincideBusqueda(pdf.nombre, filtro)
        );

        document.getElementById(contador).textContent =
            encontrados.length + " recetas";

        document.getElementById(contenedor).innerHTML =
            encontrados.length
            ? encontrados.map(pdf => `
                <div class="resultado">
                    <a href="${pdf.ruta}" target="_blank">
                        <span class="pdf">📄</span>
                        <span>${pdf.nombre}</span>
                    </a>
                </div>
            `).join('')
            : '<div class="sin-resultados">No se encontraron recetas.</div>';
    }

    function actualizar(){

        const filtro =
            document.getElementById('buscar').value;

        const favoritasFiltradas = favoritas.filter(pdf =>
            coincideBusqueda(pdf.nombre, filtro)
        );

        document.getElementById('countFavoritas').textContent =
            favoritasFiltradas.length;

        pintar(
            favoritas,
            'favoritas',
            'favoritasCounter',
            filtro
        );

        pintar(
            resto,
            'resto',
            'restoCounter',
            filtro
        );

    }

    document
    .getElementById('buscar')
    .addEventListener(
        'input',
        actualizar
    );

    actualizar();

});

</script>

</body>
</html>
