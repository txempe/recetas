<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscador de Recetas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 40px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }

        #buscar {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            box-sizing: border-box;
        }

        .resultado {
            padding: 8px 0;
        }

        .resultado a {
            text-decoration: none;
            color: #0066cc;
        }

        .resultado a:hover {
            text-decoration: underline;
        }

        .oculto {
            display: none;
        }
    </style>
</head>
<body>

<h1>Buscador de Recetas</h1>

<input
    type="text"
    id="buscar"
    placeholder="Buscar receta..."
    autofocus
>

<h2>⭐ Favoritas</h2>
<div id="favoritas"></div>

<h2>📚 Todas las demás recetas</h2>
<div id="resto"></div>

<script>
fetch('pdfs.json')
.then(response => response.json())
.then(pdfs => {

    const favoritas = pdfs.filter(pdf =>
        pdf.ruta.toLowerCase().startsWith('favoritas/')
    );

    const resto = pdfs.filter(pdf =>
        !pdf.ruta.toLowerCase().startsWith('favoritas/')
    );

    function pintar(lista, contenedor, filtro) {

        filtro = filtro.toLowerCase().trim();

        const encontrados = lista.filter(pdf =>
            pdf.nombre.toLowerCase().includes(filtro)
        );

        document.getElementById(contenedor).innerHTML =
            encontrados.length
                ? encontrados.map(pdf => `
                    <div class="resultado">
                        <a href="${pdf.ruta}" target="_blank">
                            ${pdf.nombre}
                        </a>
                    </div>
                `).join('')
                : '<div class="resultado">Sin resultados</div>';
    }

    function actualizar() {
        const filtro = document.getElementById('buscar').value;

        pintar(favoritas, 'favoritas', filtro);
        pintar(resto, 'resto', filtro);
    }

    document
        .getElementById('buscar')
        .addEventListener('input', actualizar);

    actualizar();
});
</script>

</body>
</html>
